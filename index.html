<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Klondike Solitaire in an Apple Liquid Glass design system.">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Glass Solitaire</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230A84FF'/><path d='M50 22c8 14 22 20 22 32a22 22 0 0 1-44 0c0-12 14-18 22-32z' fill='white'/></svg>">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/glass.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app">

  <header class="toolbar glass glass--2" role="banner">
    <div class="toolbar__group toolbar__group--start">
      <h1 class="toolbar__title">Solitaire</h1>
      <div class="glass-segmented" role="tablist" aria-label="Draw mode" id="draw-mode">
        <button class="glass-segmented__option" role="tab" data-draw="1" aria-selected="true">Draw 1</button>
        <button class="glass-segmented__option" role="tab" data-draw="3" aria-selected="false">Draw 3</button>
      </div>
    </div>

    <div class="toolbar__group toolbar__group--stats" aria-live="off">
      <div class="glass-stat">
        <span class="glass-stat__label">Time</span>
        <span class="glass-stat__value" id="stat-time">0:00</span>
      </div>
      <div class="glass-stat">
        <span class="glass-stat__label">Moves</span>
        <span class="glass-stat__value" id="stat-moves">0</span>
      </div>
      <div class="glass-stat">
        <span class="glass-stat__label">Score</span>
        <span class="glass-stat__value" id="stat-score">0</span>
      </div>
    </div>

    <div class="toolbar__group toolbar__group--end">
      <button class="glass-button" id="btn-undo" title="Undo (U)" aria-label="Undo" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h9a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 4 3.5 9 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="glass-button__label">Undo</span>
      </button>
      <button class="glass-button" id="btn-hint" title="Hint (H)" aria-label="Hint">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5.9 1.1 1 1.7l.1.5h5l.1-.5c.1-.6.4-1.2 1-1.7A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span class="glass-button__label">Hint</span>
      </button>
      <button class="glass-button glass-button--primary" id="btn-auto" title="Auto-complete (A)" aria-label="Auto-complete" hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 5 5L20 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="glass-button__label">Finish</span>
      </button>
      <button class="glass-button" id="btn-new" title="New game (N)" aria-label="New game">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11A8 8 0 1 0 18.5 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="glass-button__label">New</span>
      </button>
      <button class="glass-button glass-button--icon" id="btn-menu" title="Menu" aria-label="Menu" aria-haspopup="dialog">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="8.4" r="1.3" fill="currentColor"/><path d="M12 11.6v4.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main class="board" id="board">
    <div class="board__top">
      <div class="pile pile--stock" data-pile="stock" tabindex="0" role="button" aria-label="Stock pile"></div>
      <div class="pile pile--waste" data-pile="waste" aria-label="Waste pile"></div>
      <div class="board__gap"></div>
      <div class="pile pile--foundation" data-pile="foundation" data-suit="S" aria-label="Spades foundation"></div>
      <div class="pile pile--foundation" data-pile="foundation" data-suit="H" aria-label="Hearts foundation"></div>
      <div class="pile pile--foundation" data-pile="foundation" data-suit="D" aria-label="Diamonds foundation"></div>
      <div class="pile pile--foundation" data-pile="foundation" data-suit="C" aria-label="Clubs foundation"></div>
    </div>

    <div class="board__tableau">
      <div class="pile pile--tableau" data-pile="tableau" data-index="0"></div>
      <div class="pile pile--tableau" data-pile="tableau" data-index="1"></div>
      <div class="pile pile--tableau" data-pile="tableau" data-index="2"></div>
      <div class="pile pile--tableau" data-pile="tableau" data-index="3"></div>
      <div class="pile pile--tableau" data-pile="tableau" data-index="4"></div>
      <div class="pile pile--tableau" data-pile="tableau" data-index="5"></div>
      <div class="pile pile--tableau" data-pile="tableau" data-index="6"></div>
    </div>

    <p class="board__stockmeta" id="stock-meta"></p>
  </main>

  <div class="drag-layer" id="drag-layer" aria-hidden="true"></div>

  <!-- Menu / settings sheet -->
  <div class="scrim" id="menu-scrim" hidden>
    <div class="glass-sheet" role="dialog" aria-modal="true" aria-labelledby="menu-title" id="menu-sheet">
      <button class="glass-sheet__close" id="menu-close" aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <h2 class="glass-sheet__title" id="menu-title">Game</h2>

      <div class="settings-row">
        <span class="settings-row__label">Draw mode</span>
        <div class="glass-segmented" role="tablist" aria-label="Draw mode" id="draw-mode-sheet">
          <button class="glass-segmented__option" role="tab" data-draw="1" aria-selected="true">1 card</button>
          <button class="glass-segmented__option" role="tab" data-draw="3" aria-selected="false">3 cards</button>
        </div>
      </div>

      <div class="settings-row">
        <span class="settings-row__label">Appearance</span>
        <div class="glass-segmented" role="tablist" aria-label="Appearance" id="theme-mode">
          <button class="glass-segmented__option" role="tab" data-theme="auto" aria-selected="true">Auto</button>
          <button class="glass-segmented__option" role="tab" data-theme="light" aria-selected="false">Light</button>
          <button class="glass-segmented__option" role="tab" data-theme="dark" aria-selected="false">Dark</button>
        </div>
      </div>

      <div class="settings-row">
        <span class="settings-row__label">Animations</span>
        <div class="glass-segmented" role="tablist" aria-label="Animations" id="anim-mode">
          <button class="glass-segmented__option" role="tab" data-anim="on" aria-selected="true">On</button>
          <button class="glass-segmented__option" role="tab" data-anim="off" aria-selected="false">Off</button>
        </div>
      </div>

      <div class="sheet-actions">
        <button class="glass-button glass-button--primary sheet-actions__wide" id="btn-newdeal">New deal</button>
        <button class="glass-button sheet-actions__wide" id="btn-restart">Restart deal</button>
      </div>

      <h3 class="glass-sheet__subtitle">Statistics</h3>
      <dl class="stats-grid" id="stats-grid"></dl>
      <button class="glass-button glass-button--quiet" id="btn-resetstats">Reset statistics</button>

      <h3 class="glass-sheet__subtitle">Keyboard</h3>
      <ul class="keys">
        <li><kbd>Space</kbd> draw</li>
        <li><kbd>U</kbd> undo</li>
        <li><kbd>H</kbd> hint</li>
        <li><kbd>A</kbd> auto-complete</li>
        <li><kbd>N</kbd> new game</li>
        <li><kbd>R</kbd> restart</li>
        <li><kbd>Esc</kbd> close</li>
      </ul>
    </div>
  </div>

  <!-- Win overlay -->
  <div class="scrim scrim--win" id="win-scrim" hidden>
    <div class="glass-sheet glass-sheet--win" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <div class="win-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="m4 12.5 5.2 5.2L20 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2 class="glass-sheet__title" id="win-title">You win</h2>
      <p class="glass-sheet__body" id="win-summary"></p>
      <div class="sheet-actions">
        <button class="glass-button glass-button--primary sheet-actions__wide" id="btn-winnew">New deal</button>
        <button class="glass-button sheet-actions__wide" id="btn-winclose">Admire the board</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
